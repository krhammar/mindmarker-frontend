<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MindMarker - learn through short, interactive articles and quizzes." />
    <title>MindMarker</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        font-family:
          "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      }

      /* Shown until Stlite/Streamlit has rendered its first element. */
      #root:empty::before {
        content: "Loading MindMarker…";
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #555;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";

      // Reuse requirements.txt as the single source of truth for Python
      // dependencies. Streamlit itself is bundled with Stlite, so it is
      // filtered out (installing it with micropip is not supported).
      const requirements = (await (await fetch("./requirements.txt")).text())
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter((line) => line && !line.startsWith("#"))
        .filter((line) => !/^streamlit\b/i.test(line));

      mount(
        {
          entrypoint: "app.py",
          requirements,
          // Every Python file the app may import or navigate to must be
          // mounted into Stlite's in-browser file system. Files are fetched
          // from the deployed site, so app updates ship with the site.
          files: {
            "app.py": { url: "./app.py" },
            "backend_api.py": { url: "./backend_api.py" },
            "gamification.py": { url: "./gamification.py"},
            "article_math.py": { url: "./article_math.py"},
            "pages/home.py": { url: "./pages/home.py" },
            "pages/explore.py": { url: "./pages/explore.py" },
            "pages/article.py": { url: "./pages/article.py" },
            "pages/quiz.py": { url: "./pages/quiz.py" },
            "pages/progress.py": { url: "./pages/progress.py" },
          },
          // Known subpage URLs redirect to the root (see _redirects), so the
          // app always starts from the site root instead of a 404.
          basePath: "/",
          streamlitConfig: {
            "client.toolbarMode": "viewer",
            "browser.gatherUsageStats": false,
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
